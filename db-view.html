<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hook Database JSON</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      padding: 32px 16px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 2rem;
    }
    pre {
      background: #020817;
      color: #cbd5e1;
      padding: 18px;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      min-height: 200px;
    }
    .status {
      margin-bottom: 16px;
      color: #38bdf8;
      font-weight: 600;
    }
    .link {
      display: inline-block;
      margin-top: 14px;
      color: #7dd3fc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MongoDB JSON Feed</h1>
    <div id="status" class="status">Loading database entries...</div>
    <pre id="output">[]</pre>
    <a class="link" href="/dummy.html">Open random-entry test page</a>
  </div>

  <script>
    async function loadEntries() {
      const status = document.getElementById('status');
      const output = document.getElementById('output');

      try {
        const response = await fetch('/api/entries');
        if (!response.ok) {
          throw new Error('Failed to load entries.');
        }

        const data = await response.json();
        status.textContent = 'Database entries loaded successfully.';
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        status.textContent = 'Unable to load entries.';
        output.textContent = JSON.stringify({ error: error.message }, null, 2);
      }
    }

    loadEntries();
  </script>
</body>
</html>
