<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Server Data</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background: #f5f5f5; }
    .form-container { max-width: 480px; margin: 0 auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px; border-radius: 10px; }
    .success { background: #e6ffed; color: #0f5132; }
    .error { background: #ffe5e5; color: #842029; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Submit Server Info</h1>
    <form id="serverForm">
      <label for="Name">Name</label>
      <input id="Name" name="Name" type="text" required />

      <label for="ServerIP">ServerIP</label>
      <input id="ServerIP" name="ServerIP" type="text" required />

      <label for="URL">URL</label>
      <input id="URL" name="URL" type="url" required />

      <button type="submit" id="submitBtn">Submit</button>
    </form>
    <div id="message" class="message" style="display:none"></div>
  </div>

  <script>
    const form = document.getElementById('serverForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      messageDiv.style.display = 'none';
      messageDiv.textContent = '';
      messageDiv.className = 'message';

      const formData = {
        Name: document.getElementById('Name').value.trim(),
        ServerIP: document.getElementById('ServerIP').value.trim(),
        URL: document.getElementById('URL').value.trim(),
      };

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Submission failed.');
        }

        messageDiv.textContent = 'Saved successfully! ID: ' + data.insertedId;
        messageDiv.classList.add('success');
        messageDiv.style.display = 'block';
        form.reset();
      } catch (error) {
        messageDiv.textContent = error.message;
        messageDiv.classList.add('error');
        messageDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
